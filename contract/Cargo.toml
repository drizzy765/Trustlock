[package]
name = "trustlock"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Agoro Oluwatimilehin"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "5.5", features = ["unit-testing"] }

[dev-dependencies]
# Integration testing with NEAR sandbox
near-workspaces = { version = "0.14", default-features = false }
# Async runtime for tests
tokio = { version = "1.0", features = ["full"] }
# Error handling for tests
anyhow = "1.0"
# JSON serialization for test data
serde_json = "1.0"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
