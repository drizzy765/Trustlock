[package]
name = "trustlock"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Agoro Oluwatimilehin"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "5.5", features = ["unit-testing"] }

[dev-dependencies]
# near-workspaces integration tests (tests/workspaces.rs, S01-S13).
# Needs a modern sandbox (>= nearcore 2.12): the SDK 5.30 ext calls use host
# functions the 2.0.0 sandbox does not provide, and rustc >= 1.87 emits wasm
# the old VM rejects. Do not downgrade below 0.24 without re-checking S01.
near-workspaces = { version = "0.24" }
# Async runtime for tests
tokio = { version = "1.0", features = ["full"] }
# Error handling for tests
anyhow = "1.0"
# JSON serialization for test data
serde_json = "1.0"
# sha256-of-hex-string QR scheme (mirrors contract hex_keccak)
sha2 = "0.10"
# Derive macros for test views
serde = { version = "1.0", features = ["derive"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
