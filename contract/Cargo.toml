[package]
name = "trustlock"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Agoro Oluwatimilehin"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "5.5", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
