name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, 'feature/**' ]
  pull_request:
    branches: [ main, develop ]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Contract Tests
  contract-tests:
    name: Contract Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./contract
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown
    
    - name: Cache Cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Check Formatting
      run: cargo fmt -- --check
    
    - name: Run Clippy
      run: cargo clippy --target wasm32-unknown-unknown -- -D warnings -A clippy::too_many_arguments
    
    - name: Build Contract
      run: cargo build --target wasm32-unknown-unknown --release
    
    - name: Run Unit Tests
      run: cargo test --verbose
    
    - name: Check Contract Compilation
      run: cargo check --target wasm32-unknown-unknown

  # Python Agent Tests
  agent-tests:
    name: Agent Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./agent
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt || echo "No requirements.txt yet"
      continue-on-error: true
    
    - name: Run Tests
      run: |
        python -m pytest ../tests/ -v || echo "No tests yet"
      continue-on-error: true

  # Web Build Check
  web-build:
    name: Web Build Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: Install Dependencies
      run: npm install
      continue-on-error: true
    
    - name: Build
      run: npm run build || echo "Build may need dependencies installed"
      continue-on-error: true
    
    - name: Type Check
      run: npx tsc --noEmit || echo "TypeScript config may need setup"
      continue-on-error: true

  # Documentation Check
  docs-check:
    name: Documentation Check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Check README
      run: |
        test -f README.md || (echo "README.md missing" && exit 1)
        test -f AGENTS.md || (echo "AGENTS.md missing" && exit 1)
        test -f docs/architecture.md || (echo "docs/architecture.md missing" && exit 1)
    
    - name: Check Phase Documentation
      run: |
        test -f docs/phase1_checklist.md || echo "Phase 1 checklist missing"
        test -f docs/phase2_status.md || echo "Phase 2 status missing"

  # Security Audit
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./contract
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    
    - name: Install cargo-audit
      run: cargo install cargo-audit || echo "cargo-audit may already be installed"
      continue-on-error: true
    
    - name: Run Security Audit
      run: cargo audit || echo "Audit completed with warnings"
      continue-on-error: true
